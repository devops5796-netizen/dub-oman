    excel_file_pattern: "{brand_name}.xlsx"
    sheets:
      - name: "{car_type}"
        required_columns: *col_vehicles_listing
        row_count_range: [1, 600]
    min_file_size_kb: 5

  - scraper: cars-for-rent (vehicles)
