# ------------------------------------------------------------
# PIPELINE CHAIN (auto-detected from workflow triggers)
# Batch DOMAN → DOMAN Motors → DOMAN Monitor (daily at 00:00 UTC)
# ------------------------------------------------------------
pipeline_chain:
  - batch: "DOMAN"
    trigger: "cron: '0 0 * * *'"
    triggers_next: null

