name: DOMAN

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Scrape & Clean & Upload (all except summary.json)
  # =========================================================================
  scrape-and-clean:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        category:
          - vehicles
          - properties-for-rent
          - properties-for-sale
          - mobile-phones-accessories
          - electronics-home-appliances
          - home-garden
          - fashion-beauty
          - pets
          - kids-babies
          - sporting-goods-bikes
          - hobbies-music-art-books
          - jobs-services
          - business-industrial
          - services

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Scrape ${{ matrix.category }}
        # env:
        #   AUTHORIZATION: ${{ secrets.AUTHORIZATION }}
        run: python main.py --category ${{ matrix.category }} --out-dir data

      - name: Clean & upload (exclude summary.json)
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: python clean_and_upload.py data/${{ matrix.category }}.csv --date "$(date -u +%Y-%m-%d)" --skip-summary

      - name: Upload summary placeholder (to be finalized later)
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.category }}
          path: |
            summary_placeholder_${{ matrix.category }}.json
          if-no-files-found: ignore

  # =========================================================================
  # 2. Finalize summaries (add duration and upload)
  # =========================================================================
  finalize-summaries:
    runs-on: ubuntu-latest
    needs: scrape-and-clean
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Get workflow duration from GitHub API
      - name: Get workflow duration
        id: workflow_duration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          START_TIMESTAMP=$(date -d "$STARTED_AT" +%s)
          NOW_TIMESTAMP=$(date -u +%s)
          DURATION_SEC=$((NOW_TIMESTAMP - START_TIMESTAMP))
          echo "start_time=$START_TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "duration_sec=$DURATION_SEC" >> "$GITHUB_OUTPUT"
          echo "Workflow started at: $STARTED_AT"
          echo "Workflow duration: ${DURATION_SEC}s"

      - name: Download all summary placeholders
        uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          merge-multiple: true
          path: summaries/

      - name: Finalize and upload summaries to R2
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          WORKFLOW_DURATION: ${{ steps.workflow_duration.outputs.duration_sec }}
          WORKFLOW_START_TIME: ${{ steps.workflow_duration.outputs.start_time }}
        run: |
          python finalize_summaries.py --summaries-dir summaries/ --date "$(date -u +%Y-%m-%d)"