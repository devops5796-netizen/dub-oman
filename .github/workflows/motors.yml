name: DOMAN Motors

on:
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Scrape & Clean & Upload (all except summary.json)
  # =========================================================================
  scrape_list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape listing pages
        run: python main_motors.py --mode list

      - name: Upload car list
        uses: actions/upload-artifact@v4
        with:
          name: new-cars-list
          path: new_cars.csv

  detect_detail_jobs:
    runs-on: ubuntu-latest
    needs: scrape_list
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Download car list
        uses: actions/download-artifact@v4
        with:
          name: new-cars-list

      - name: Build detail-job matrix
        id: build_matrix
        run: |
          python << 'EOF'
          import json
          import os
          import pandas as pd

          CHUNK_SIZE = 300

          df = pd.read_csv("new_cars.csv")
          n = len(df)
          print(f"Total cars: {n}")

          matrix = {"include": []}
          for i in range(0, n, CHUNK_SIZE):
              start = i
              end = min(i + CHUNK_SIZE, n)
              matrix["include"].append({"start": start, "end": end})

          print(f"Total detail jobs: {len(matrix['include'])}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"matrix={json.dumps(matrix)}\n")
          EOF

  scrape_details:
    runs-on: ubuntu-latest
    needs: detect_detail_jobs
    strategy:
      matrix: ${{ fromJson(needs.detect_detail_jobs.outputs.matrix) }}
      max-parallel: 15
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download car list
        uses: actions/download-artifact@v4
        with:
          name: new-cars-list

      - name: Scrape car details [${{ matrix.start }}:${{ matrix.end }}]
        run: python main_motors.py --mode details --start ${{ matrix.start }} --end ${{ matrix.end }}

      - name: Upload chunk results
        uses: actions/upload-artifact@v4
        with:
          name: details-${{ matrix.start }}-${{ matrix.end }}
          path: |
            car_details_${{ matrix.start }}_${{ matrix.end }}.csv
            failed_urls_motors_${{ matrix.start }}_${{ matrix.end }}.json
            request_stats_motors_${{ matrix.start }}_${{ matrix.end }}.json
          if-no-files-found: ignore

  merge_details:
    runs-on: ubuntu-latest
    needs: scrape_details
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download all detail chunks
        uses: actions/download-artifact@v4
        with:
          pattern: details-*
          merge-multiple: true
          path: details_parts/

      - name: Merge chunks
        run: |
          python merge_car_details.py \
            --details-dir details_parts \
            --output-csv all_motors_cars.csv \
            --failed-output failed_urls_motors.json \
            --stats-output request_stats_motors.json

      - name: Upload merged data
        uses: actions/upload-artifact@v4
        with:
          name: merged-cars
          path: |
            all_motors_cars.csv
            failed_urls_motors.json
            request_stats_motors.json
          if-no-files-found: ignore

  finalize:
    runs-on: ubuntu-latest
    needs: merge_details
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download merged data
        uses: actions/download-artifact@v4
        with:
          name: merged-cars

      - name: Split by make/model & upload to R2 (exclude summary.json)
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          python motors_cleaning.py all_motors_cars.csv \
            --mode finalize \
            --skip-summary

      - name: Upload summary placeholder (to be finalized later)
        uses: actions/upload-artifact@v4
        with:
          name: summary-motors
          path: |
            summary_placeholder_motors.json
          if-no-files-found: ignore

  # =========================================================================
  # 2. Finalize summaries (add duration and upload)
  # =========================================================================
  finalize-summaries:
    runs-on: ubuntu-latest
    needs: finalize
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get workflow start time
        id: workflow_start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STARTED_AT=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          echo "start_time=$(date -d "$STARTED_AT" +%s)" >> "$GITHUB_OUTPUT"

      - name: Download all summary placeholders
        uses: actions/download-artifact@v4
        with:
          pattern: summary-*
          merge-multiple: true
          path: summaries/

      - name: Finalize and upload summaries to R2
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          NOW_TIMESTAMP=$(date -u +%s)
          DURATION_SEC=$((NOW_TIMESTAMP - ${{ steps.workflow_start.outputs.start_time }}))
          echo "Workflow duration right before upload: ${DURATION_SEC}s"
          WORKFLOW_DURATION="$DURATION_SEC" python finalize_summaries.py --summaries-dir summaries/ --date "$(date -u +%Y-%m-%d)"