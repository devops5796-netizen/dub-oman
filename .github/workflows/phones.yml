name: Fetch Phones

on:
  workflow_run:
    workflows: ["DOMAN"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      date:
        description: "Data date (YYYY-MM-DD) - default: today"
        required: false
      delay_min:
        description: "Min delay (sec)"
        required: false
        default: "5"
      delay_max:
        description: "Max delay (sec)"
        required: false
        default: "10"

concurrency:
  group: fetch-phones
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      categories: ${{ steps.cats.outputs.categories }}
      date: ${{ steps.date.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - run: pip install -r requirements.txt

      # نحسب التاريخ مرة واحدة عشان كل الـ jobs تستخدم نفس اليوم
      - name: Determine date
        id: date
        env:
          IN_DATE: ${{ inputs.date }}
        run: |
          echo "date=${IN_DATE:-$(date -u +%Y-%m-%d)}" >> "$GITHUB_OUTPUT"

      - name: List categories
        id: cats
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          CATS=$(python fetch_phones.py --date "$DATE" --list-categories)
          echo "Categories: $CATS"
          echo "categories=$CATS" >> "$GITHUB_OUTPUT"

  fetch-phones:
    name: Phones - ${{ matrix.category }}
    needs: prepare
    if: needs.prepare.outputs.categories != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false      # category فشلت ما توقفش الباقي
      max-parallel: 1       # واحدة ورا التانية
      matrix:
        category: ${{ fromJSON(needs.prepare.outputs.categories) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Fetch phones - ${{ matrix.category }}
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          CATEGORY: ${{ matrix.category }}
          DATE: ${{ needs.prepare.outputs.date }}
          DELAY_MIN: ${{ inputs.delay_min || '5' }}
          DELAY_MAX: ${{ inputs.delay_max || '10' }}
        run: |
          echo "Category: $CATEGORY | Date: $DATE"
          python fetch_phones.py \
            --date "$DATE" \
            --delay-min "$DELAY_MIN" \
            --delay-max "$DELAY_MAX" \
            --categories "$CATEGORY"