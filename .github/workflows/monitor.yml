name: DOMAN Monitor

on:
  workflow_run:
    workflows: ["DOMAN"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build_stats:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 openpyxl pyyaml python-dotenv pandas

      - name: Upload site.yml
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
            python << 'EOF'
            import boto3
            import os
            client = boto3.client('s3',
                        endpoint_url=os.environ['CF_R2_ENDPOINT_URL'],
                        aws_access_key_id=os.environ['CF_R2_ACCESS_KEY_ID'],
                        aws_secret_access_key=os.environ['CF_R2_SECRET_ACCESS_KEY'],
                        region_name='auto'
                    )
            local_file = "monitor/site.yml" 
            object_key = "monitor-sites/DOMAN/site.yml"
            client.upload_file(local_file, os.environ['CF_R2_BUCKET_NAME'], object_key)
            print(f"Uploaded to {os.environ['CF_R2_BUCKET_NAME']}/{object_key}")
            EOF

      - name: Upload websites-config.yml
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: python monitor/build_monitor_data.py --prefix DOMAN --upload-config

      - name: Diagnose R2 paths
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: python monitor/diagnose_r2_paths.py --prefix DOMAN --days 5

      # - name: Diagnose excel files
      #   env:
      #     CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      #     CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      #     CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
      #     CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
      #   run: python monitor/diagnose_excel_files.py --prefix DOMAN --category Vehicles --date 2026-08-02
      
      
      # - name: Build stats (test mode)
      #   env:
      #     CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      #     CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      #     CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
      #     CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
      #   run: python monitor/build_monitor_data.py --prefix DOMAN --build-stats --days 3 --no-save --output-stats test_stats.yml

      # - name: Show test stats
      #   run: cat test_stats.yml


      - name: Upload monitor_stats.yml
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: python monitor/build_monitor_data.py --prefix DOMAN --build-stats --days 7

      - name: Upload report.json
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          DATE_PREFIX=$(date +'%Y-%m-%d')
          echo "Generating report for: $DATE_PREFIX"
          python monitor/build_monitor_data.py --prefix DOMAN --report-date 2026-08-10